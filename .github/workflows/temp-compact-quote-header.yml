name: Temporary compact quote header

on:
  push:
    branches:
      - m7-5-commercial-terminology
    paths:
      - .github/workflows/temp-compact-quote-header.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7-5-commercial-terminology
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply compact header patch
        run: python scripts/temp-compact-quote-header.py

      - name: Typecheck
        run: pnpm typecheck

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Compact commercial quote editor header
          file_pattern: app/(app)/quotes/[id]/edit/quote-editor.tsx
